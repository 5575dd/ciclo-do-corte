name: Sincronizar agendamentos oficiais

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preparar consulta
        run: npm install --omit=dev
      - name: Consultar site e enviar ao aparelho
        env:
          BOOKING_PHONE: ${{ secrets.BOOKING_PHONE }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/sync-official-appointments.mjs
