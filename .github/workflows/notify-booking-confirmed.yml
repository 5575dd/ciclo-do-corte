name: Avisar corte confirmado
run-name: Corte confirmado ${{ inputs.date }} ${{ inputs.time }}

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Data confirmada (AAAA-MM-DD)"
        required: true
        type: string
      time:
        description: "Horário confirmado (HH:MM)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preparar avisos
        run: npm install --omit=dev
      - name: Enviar confirmação ao app
        env:
          BOOKING_DATE: ${{ inputs.date }}
          BOOKING_TIME: ${{ inputs.time }}
          BOOKING_REQUEST_ID: notify-${{ github.run_id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node scripts/notify-confirmed-booking.mjs
