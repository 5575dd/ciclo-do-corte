name: Atualizar horários

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Enviar uma notificação de teste"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: availability-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preparar notificações
        run: |
          npm install --omit=dev
          cp data/availability.json "$RUNNER_TEMP/availability-before.json"
      - name: Consultar agenda
        run: node scripts/update-availability.mjs
      - name: Avisar novas vagas
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          PREVIOUS_AVAILABILITY_FILE: ${{ runner.temp }}/availability-before.json
          FORCE_TEST: ${{ inputs.test_notification }}
        run: node scripts/send-push.mjs
      - name: Publicar atualização
        run: |
          git config user.name "ciclo-do-corte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json
          git diff --cached --quiet || git commit -m "Atualiza horários disponíveis"
          git push
